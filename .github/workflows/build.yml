name: Compile LaTeX and Create Release
on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  workflow_dispatch:

jobs:
  compile_latex:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX documents
        uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            resume.tex
            resume-fde.tex
          latexmk_use_xelatex: true

      - name: Check for PDFs
        run: |
          missing=0
          for f in resume.pdf resume-fde.pdf; do
            if [ -f "$f" ]; then
              echo "PDF file found: $f"
            else
              echo "PDF file not found: $f"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Require single-page PDFs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          for f in resume.pdf resume-fde.pdf; do
            pages=$(pdfinfo "$f" | awk '/^Pages:/ {print $2}')
            echo "$f page count: $pages"
            if [ "$pages" != "1" ]; then
              echo "::error::$f must be exactly 1 page (got $pages)"
              exit 1
            fi
          done

      - name: Upload PDF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: resume-pdf
          path: |
            resume.pdf
            resume-fde.pdf

  create_release:
    needs: compile_latex
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Extract branch name
        shell: bash
        run: echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT
        id: extract_branch

      - name: Download PDF artifact
        uses: actions/download-artifact@v4
        with:
          name: resume-pdf

      - name: Rename PDFs
        run: |
          mv resume.pdf "Pushpinder's Resume.pdf"
          mv resume-fde.pdf "Pushpinder's FDE Resume.pdf"

      - name: Create Release with Asset
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
        with:
          tag_name: v${{ steps.date.outputs.date }}-${{ steps.extract_branch.outputs.branch }}
          name: Release - ${{ steps.extract_branch.outputs.branch }} - ${{ steps.date.outputs.date }}
          files: |
            Pushpinder's Resume.pdf
            Pushpinder's FDE Resume.pdf
          draft: false
          prerelease: false
          generate_release_notes: true


  upload_asset:
    needs: [compile_latex, create_release]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download PDF artifact
        uses: actions/download-artifact@v4
        with:
          name: resume-pdf

      - name: Release Asset
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
        with:
          tag_name: v${{ steps.date.outputs.date }}
          files: |
            resume.pdf
            resume-fde.pdf
          name: Pushpinder_Resume.pdf

  deploy_to_github_pages:
    needs: compile_latex
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download PDF artifact
        uses: actions/download-artifact@v4
        with:
          name: resume-pdf

      - name: Create deployment directory
        run: |
          mkdir -p out
          mv resume.pdf out/Pushpinder_Resume.pdf
          mv resume-fde.pdf out/Pushpinder_Resume_FDE.pdf

      - name: Create index.html
        run: |
          echo '<html><body><a href="Pushpinder_Resume.pdf">View Resume</a> | <a href="Pushpinder_Resume_FDE.pdf">View FDE Resume</a></body></html>' > out/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.PAT }}
          publish_dir: ./out
          publish_branch: gh-pages
